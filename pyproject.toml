[project]
name = "iconeval"
version = "0.10.0"
description = "Convenient evaluation of ICON model output with ESMValTool"
authors = [
    {name = "Manuel Schlund", email = "manuel.schlund@dlr.de"},
    {name = "Lisa Bock", email = "lisa.bock@dlr.de"},
]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ICON", "ESMValTool", "Earth System Model Evaluation"]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fire",
    "loguru",
    "python-swiftclient",
    "pyyaml",
    "requests",
]

[project.scripts]
iconeval = "iconeval.main:main"
publish_html = "iconeval.output_handling.publish_html:main"


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
fire = "*"
loguru = "*"
python = ">=3.12"
python-swiftclient = "*"
pyyaml = "*"
requests = "*"

[tool.pixi.pypi-dependencies]
iconeval = { path = ".", editable = true }

[tool.pixi.environments]
default = { features= ["esmvaltool", "dev", "test"], solve-group = "default" }
esmvaltool-dev = { features= ["esmvaltool-dev", "dev", "test"], solve-group = "esmvaltool-dev" }
test-py312 = { features = ["esmvaltool", "py312", "test"], solve-group = "py312" }
test-py313 = { features = ["esmvaltool", "py313", "test"], solve-group = "py313" }

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
py-markdown-table = "*"

[tool.pixi.feature.esmvaltool.dependencies]
esmvalcore = ">=2.14.0"
esmvaltool-python = ">=2.14.0"

# Ensure that all ESMValTool dependencies are installed from conda-forge, not PyPI
[tool.pixi.feature.esmvaltool-dev.dependencies]
# Basic dependencies
"cf-units" = "*"
"dask" = "!=2024.8.0"  # https://github.com/dask/dask/issues/11296
"distributed" = "*"
"iris" = ">=3.11"
"matplotlib-base" = "*"
"numpy" = ">=2"
"pyyaml" = "*"
# All dependencies
"aiohttp" = "*"
"cartopy" = "*"
"cdo" = ">=2.3.0"
"cdsapi" = "*"
"cfgrib" = "*"
"cftime" = "*"
"cmocean" = "*"
"cython" = "*"
"ecmwf-api-client" = "*"
"eofs" = "*"
"esmpy" = "*"
"fiona" = "*"
"fire" = "*"
"fsspec" = "*"
"gdal" = ">=3.9.0"
"ipython" = "*"
"imagehash" = "*"
"iris-esmf-regrid" = ">=0.10.0"  # github.com/SciTools-incubator/iris-esmf-regrid/pull/342
"jinja2" = "*"
"joblib" = "*"
"lime" = "*"
"mapgenerator" = ">=1.0.5"
"natsort" = "*"
"nc-time-axis" = "*"
"netCDF4" = "*"
"numba" = "*"
"openpyxl" = "*"
"packaging" = "*"
"pandas" = "*"
"pip" = "!=21.3"
"progressbar2" = "*"
"prov" = "*"
"pyproj" = ">=2.1"
"python" = ">=3.12"
"python-cdo" = "*"
"python-dateutil" = "*"
"rasterio" = ">=1.3.10"
"requests" = "*"
"rich" = "*"
"scikit-image" = "*"
"scikit-learn" = ">=1.4.0"  # github.com/ESMValGroup/ESMValTool/issues/3504
"scipy" = "*"
"seaborn" = "*"
"seawater" = "*"
"shapely" = ">=2.0.2"
"xarray" = ">=0.12.0"
"xesmf" = ">=0.7.1"
"xgboost" = ">1.6.1"  # github.com/ESMValGroup/ESMValTool/issues/2779
"xlsxwriter" = "*"
"zarr" = "*"

[tool.pixi.feature.esmvaltool-dev.pypi-dependencies]
esmvalcore = { git = "https://github.com/ESMValGroup/ESMValCore.git", branch = "main" }
esmvaltool = { git = "https://github.com/ESMValGroup/ESMValTool.git", branch = "main" }
# esmvalcore = { path = "../ESMValCore", editable = true }
# esmvaltool = { path = "../ESMValTool", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-datadir = "*"
pytest-mock = "*"
pytest-xdist = "*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"


[tool.codespell]
ignore-words-list = "emac,oce,pres"
skip = "pixi.lock"


[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "uses_expected_output: Test uses pre-calculated expected output",
]
minversion = "6.0"
xfail_strict = true


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",     # Dynamically typed expressions (typing.Any) are disallowed
    "C901",       # Function is too complex
    "DTZ",        # Missing timezone information
    "G004",       # Logging statement uses f-string
    "PLR0912",    # Too many branches
    "PLR0913",    # Too many arguments in function definition
    "PLR0915",    # Too many statements
    "PLW2901",    # `for` loop variable overwritten by assignment target
]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "ARG001",     # Unused function arguments
    "D100",       # Missing docstring in public module
    "D101",       # Missing docstring in public class
    "D102",       # Missing docstring in public method
    "D103",       # Missing docstring in public function
    "D104",       # Missing docstring in public package
    "FBT001",     # Boolean-typed positional argument in function definition
    "S101",       # Use of `assert` detected
    "SLF001",     # Private member accessed
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
