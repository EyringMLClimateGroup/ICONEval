  dataset: ICON
  exp: input
  project: ICON
preprocessors:
  create_global_annual_mean_time_series:
    custom_order: true
    regrid:
      target_grid: 2x2
      scheme: linear
    mask_landsea:
      mask_out: sea
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean
  create_global_sum_annual_mean_time_series:
    custom_order: true
    regrid:
      target_grid: 2x2
      scheme: linear
    area_statistics:
      operator: sum
    annual_statistics:
      operator: mean
    convert_units:
      units: Pg yr-1
  create_global_mean_monthly_climatology:
    custom_order: true
    regrid:
      scheme: linear
      target_grid: 2x2
    mask_landsea:
      mask_out: sea
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: month
  create_global_sum_monthly_climatology:
    custom_order: true
    regrid:
      scheme: linear
      target_grid: 2x2
    area_statistics:
      operator: sum
    climate_statistics:
      operator: mean
      period: month
    convert_units:
      units: Pg yr-1
