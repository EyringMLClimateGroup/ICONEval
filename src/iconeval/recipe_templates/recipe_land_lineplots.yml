# ESMValTool
#TAGS land
#TAGS annual-cycle
#TAGS timeseries
---
documentation:
  title: Land Evaluation (Time series and Anunal Cycles).
  description: >
    Line plots of several land variables that can be used for the evaluations
    of coupled simulations containing land components.
  authors:
    - gier_bettina
    - hassler_birgit


# YAML anchors for later use

defaults_cmip6: &defaults_cmip6
  project: CMIP6
  exp: historical
  ensemble: r1i1p1f1
  grid: gn
  timerange: 19790101/20141231  # 18500101/20141231

datasets_gpp: &datasets_gpp  # fix list of models to avoid missing years
  - {<<: *defaults_cmip6, dataset: ACCESS-ESM1-5}
  - {<<: *defaults_cmip6, dataset: AWI-ESM-1-1-LR}
  - {<<: *defaults_cmip6, dataset: BCC-CSM2-MR}
  - {<<: *defaults_cmip6, dataset: BCC-ESM1}
  - {<<: *defaults_cmip6, dataset: CESM2}
  - {<<: *defaults_cmip6, dataset: CESM2-WACCM}
  - {<<: *defaults_cmip6, dataset: CMCC-CM2-SR5}
  - {<<: *defaults_cmip6, dataset: CMCC-ESM2}
  - {<<: *defaults_cmip6, dataset: CanESM5}
  - {<<: *defaults_cmip6, dataset: GISS-E2-1-G}
  - {<<: *defaults_cmip6, dataset: GISS-E2-1-G-CC}
  - {<<: *defaults_cmip6, dataset: GISS-E2-1-H}
  - {<<: *defaults_cmip6, dataset: ICON-ESM-LR}
  - {<<: *defaults_cmip6, dataset: MPI-ESM-1-2-HAM}
  - {<<: *defaults_cmip6, dataset: MPI-ESM1-2-HR}
  - {<<: *defaults_cmip6, dataset: MPI-ESM1-2-LR}
  - {<<: *defaults_cmip6, dataset: NorCPM1}
  - {<<: *defaults_cmip6, dataset: NorESM2-LM}
  - {<<: *defaults_cmip6, dataset: NorESM2-MM}
  - {<<: *defaults_cmip6, dataset: SAM0-UNICON}
  - {<<: *defaults_cmip6, dataset: TaiESM1}
  - {<<: *defaults_cmip6, dataset: UKESM1-0-LL, ensemble: r1i1p1f2}
  - {project: OBS, dataset: MTE, type: reanaly, version: May12, tier: 3, timerange: 19820101/20111231}  # 19820101/20111231

datasets_lai: &datasets_lai  # fix list of models to avoid CMOR check error
  - {<<: *defaults_cmip6, dataset: ACCESS-ESM1-5}
  - {<<: *defaults_cmip6, dataset: AWI-ESM-1-1-LR}
  - {<<: *defaults_cmip6, dataset: BCC-CSM2-MR}
  - {<<: *defaults_cmip6, dataset: BCC-ESM1}
  - {<<: *defaults_cmip6, dataset: CESM2}
  - {<<: *defaults_cmip6, dataset: CESM2-WACCM}
  - {<<: *defaults_cmip6, dataset: CMCC-CM2-HR4}
  - {<<: *defaults_cmip6, dataset: CMCC-CM2-SR5}
  - {<<: *defaults_cmip6, dataset: CMCC-ESM2}
  - {<<: *defaults_cmip6, dataset: CanESM5}
  - {<<: *defaults_cmip6, dataset: GISS-E2-1-G}
  - {<<: *defaults_cmip6, dataset: GISS-E2-1-G-CC}
  - {<<: *defaults_cmip6, dataset: GISS-E2-1-H}
  - {<<: *defaults_cmip6, dataset: HadGEM3-GC31-LL, ensemble: r1i1p1f3}
  - {<<: *defaults_cmip6, dataset: MPI-ESM-1-2-HAM}
  - {<<: *defaults_cmip6, dataset: MPI-ESM1-2-HR}
  - {<<: *defaults_cmip6, dataset: MPI-ESM1-2-LR}
  - {<<: *defaults_cmip6, dataset: NorESM2-LM}
  - {<<: *defaults_cmip6, dataset: NorESM2-MM}
  - {<<: *defaults_cmip6, dataset: SAM0-UNICON}
  - {<<: *defaults_cmip6, dataset: TaiESM1}
  - {<<: *defaults_cmip6, dataset: UKESM1-0-LL, ensemble: r1i1p1f2}
  - {project: OBS, dataset: LAI3g, type: reanaly, version: 1-regridded, tier: 3, timerange: 19820101/20181231}  # 19810701/20181231

supplementary_variables: &supplementary_variables
  - {short_name: areacella, skip: true}
  - {short_name: areacello, skip: true}
  - {short_name: sftlf, skip: true}
  - {short_name: sftof, skip: true}

plot_script: &plot_script
  script: monitor/multi_datasets.py
  facet_used_for_labels: alias
  figure_kwargs:
    figsize: [7, 5]
  group_variables_by: variable_group
  plot_filename: "{plot_type}_{exp}_{real_name}_{dataset}_{mip}"
  plot_folder: "{plot_dir}"

plot_options: &plot_options
  gridline_kwargs:
    color: darkgray
    linewidth: 0.5
    alpha: 0.3
  legend_kwargs:
    loc: upper center
    bbox_to_anchor: [0.5, -0.4]
    borderaxespad: 0.0
  pyplot_kwargs:
    title: "{title}"
    ylabel: "{short_name} [{ylabel_units}]"
  plot_kwargs:
    "{{alias_plot_kwargs}}":
      label: "{dataset} ({exp})"
      linewidth: 1.25
      zorder: 2.5
    default:  # These will be used for CMIP6 models
      color: lightgray
      label: null
      linewidth: 0.75
      zorder: 1.0
    CMIP6:
      label: "{project}"  # just to have one label for the gray lines
    CMIP6_CESM2:
      label: "{project}"  # just to have one label for the gray lines
    OBS: &obs_format
      color: black
      label: "{dataset}"
      linewidth: 1.0
      zorder: 2.4
    OBS6: &obs6_format
      <<: *obs_format
      linestyle: dashdot
    native6: &native6_format
      <<: *obs_format
      linestyle: dotted
    OBS_LAI3g: *obs_format
    OBS_MTE: *obs_format


datasets: "{{dataset_list}}"


preprocessors:

  create_global_annual_mean_time_series:
    custom_order: true
    regrid:
      target_grid: 2x2
      scheme: linear  # some models do not work with ESMFAreaWeighted
    mask_landsea:
      mask_out: sea
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean

  create_global_sum_annual_mean_time_series:
    custom_order: true
    regrid:
      target_grid: 2x2
      scheme: linear  # some models do not work with ESMFAreaWeighted
    area_statistics:
      operator: sum
    annual_statistics:
      operator: mean
    convert_units:
      units: Pg yr-1

  create_global_mean_monthly_climatology:
    custom_order: true
    regrid:
      scheme: linear  # some models do not work with ESMFAreaWeighted
      target_grid: 2x2
    mask_landsea:
      mask_out: sea
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: month

  create_global_sum_monthly_climatology:
    custom_order: true
    regrid:
      scheme: linear  # some models do not work with ESMFAreaWeighted
      target_grid: 2x2
    area_statistics:
      operator: sum
    climate_statistics:
      operator: mean
      period: month
    convert_units:
      units: Pg yr-1


diagnostics:

  timeseries:
    description: Time series for multiple variables.
    themes:
      - bgchem
      - carbon
    realms:
      - land
    variables:
      gpp:
        mip: Lmon
        preprocessor: create_global_sum_annual_mean_time_series
        title: Gross Primary Production (GPP)
        ylabel_units: PgC yr-1
        additional_datasets: *datasets_gpp
        supplementary_variables: *supplementary_variables
      lai:
        mip: Lmon
        preprocessor: create_global_annual_mean_time_series
        title: Leaf Area Index (LAI)
        ylabel_units: "1"
        additional_datasets: *datasets_lai
        supplementary_variables: *supplementary_variables
    scripts:
      plot:
        <<: *plot_script
        plots:
          timeseries:
            <<: *plot_options

  annual_cycles:
    description: Annual cycle plots for multiple variables.
    themes:
      - bgchem
      - carbon
    realms:
      - land
    variables:
      gpp:
        mip: Lmon
        preprocessor: create_global_sum_monthly_climatology
        title: Gross Primary Production (GPP)
        ylabel_units: PgC yr-1
        additional_datasets: *datasets_gpp
        supplementary_variables: *supplementary_variables
      lai:
        mip: Lmon
        preprocessor: create_global_mean_monthly_climatology
        title: Leaf Area Index (LAI)
        ylabel_units: "1"
        additional_datasets: *datasets_lai
        supplementary_variables: *supplementary_variables
    scripts:
      plot:
        <<: *plot_script
        plots:
          annual_cycle:
            <<: *plot_options
