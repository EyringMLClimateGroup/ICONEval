# ESMValTool
#TAGS land
#TAGS annual-cycle
#TAGS timeseries
---
documentation:
  title: Land Evaluation (Time series and Anunal Cycles).
  description: >
    Show line plots of several land variables that can be used for the
    evaluations of coupled simulations containing land components.
  authors:
    - gier_bettina
    - hassler_birgit


# YAML anchors for later use

datasets_cmip6: &datasets_cmip6
  - {project: CMIP6, dataset: "*", exp: historical, ensemble: r1i1p1f1, grid: gn, institute: "*", timerange: 19790101/20141231}  # 18500101/20141231

datasets_gpp: &datasets_gpp
  - {project: OBS, dataset: MTE, type: reanaly, version: May12, tier: 3, timerange: 19820101/20111231}  # 19820101/20111231

datasets_lai: &datasets_lai
  - {project: OBS, dataset: LAI3g, type: reanaly, version: 1-regridded, tier: 3, timerange: 19820101/20181231}  # 19810701/20181231

supplementary_variables: &supplementary_variables
  - {short_name: areacella, skip: true}
  - {short_name: areacello, skip: true}
  - {short_name: sftlf, skip: true}
  - {short_name: sftof, skip: true}

plot_script: &plot_script
  script: monitor/multi_datasets.py
  facet_used_for_labels: alias
  figure_kwargs:
    figsize: [7, 5]
  group_variables_by: variable_group
  plot_filename: "{plot_type}_{exp}_{real_name}_{dataset}_{mip}"
  plot_folder: "{plot_dir}"

plot_options: &plot_options
  gridline_kwargs:
    color: darkgray
    linewidth: 0.5
    alpha: 0.3
  legend_kwargs:
    loc: upper center
    bbox_to_anchor: [0.5, -0.4]
    borderaxespad: 0.0
  pyplot_kwargs:
    title: "{title}"
  plot_kwargs:
    "{{alias_plot_kwargs}}":
      label: "{dataset} ({exp})"
      linewidth: 1.25
      zorder: 2.5
    default:  # These will be used for CMIP6 models
      color: lightgray
      label: null
      linewidth: 0.75
      zorder: 1.0
    CMIP6:
      label: "{project}"  # just to have one label for the gray lines
    CMIP6_CESM2:
      label: "{project}"  # just to have one label for the gray lines
    OBS: &obs_format
      color: black
      label: "{dataset}"
      linewidth: 1.0
      zorder: 2.4
    OBS6: &obs6_format
      <<: *obs_format
      linestyle: dashdot
    native6: &native6_format
      <<: *obs_format
      linestyle: dotted
    OBS_LAI3g: *obs_format
    OBS_MTE: *obs_format


datasets: "{{dataset_list}}"


preprocessors:

  create_global_annual_mean_time_series:
    custom_order: true
    regrid:
      target_grid: 2x2
      scheme: linear  # some models do not work with ESMFAreaWeighted
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean

  create_monthly_climatology:
    custom_order: true
    regrid:
      scheme: linear  # some models do not work with ESMFAreaWeighted
      target_grid: 2x2
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: month


diagnostics:

  timeseries:
    description: Time series for multiple variables.
    themes:
      - bgchem
      - carbon
    realms:
      - land
    variables:
      gpp:
        mip: Lmon
        preprocessor: create_global_annual_mean_time_series
        title: Gross Primary Production (GPP)
        additional_datasets: *datasets_gpp
        supplementary_variables: *supplementary_variables
      lai:
        mip: Lmon
        preprocessor: create_global_annual_mean_time_series
        title: Leaf Area Index (LAI)
        additional_datasets: *datasets_lai
        supplementary_variables: *supplementary_variables
    additional_datasets: *datasets_cmip6
    scripts:
      plot:
        <<: *plot_script
        plots:
          timeseries:
            <<: *plot_options

  annual_cycles:
    description: Annual cycle plots for multiple variables.
    themes:
      - bgchem
      - carbon
    realms:
      - land
    variables:
      gpp:
        mip: Lmon
        preprocessor: create_monthly_climatology
        title: Gross Primary Production (GPP)
        additional_datasets: *datasets_gpp
        supplementary_variables: *supplementary_variables
      lai:
        mip: Lmon
        preprocessor: create_monthly_climatology
        title: Leaf Area Index (LAI)
        additional_datasets: *datasets_lai
        supplementary_variables: *supplementary_variables
    additional_datasets: *datasets_cmip6
    scripts:
      plot:
        <<: *plot_script
        plots:
          annual_cycle:
            <<: *plot_options
