#TAGS ocean
#TAGS map
#TAGS zonal-mean
---
documentation:
  title: Ocean Transport Evaluation.
  description: >
    <p>Evaluation of ocean transport.</p>
    <p><i>Note</i></p>
    <p>Time ranges for the different datasets differ:
    <ul>
    <li>{{dataset}}: {{timerange}}</li>
    <li>CMIP6: 19950101/20141231</li>
    </ul></p>
  authors:
    - debeire_kevin
  references:
    - demora2018gmd


# YAML anchors for later use

datasets_cmip6: &datasets_cmip6
  - {project: CMIP6, dataset: "*", exp: historical, ensemble: r1i1p1f1, grid: gn, institute: "*", timerange: 19950101/20141231}  # 18500101/20141231

plot_script: &plot_script
  script: monitor/multi_datasets.py
  facet_used_for_labels: alias
  figure_kwargs:
    figsize: [7, 5]
  group_variables_by: variable_group
  plot_filename: "{plot_type}_{exp}_{real_name}_{dataset}_{mip}"
  plot_folder: "{plot_dir}"

variable_vs_lat_plot: &variable_vs_lat_plot
  gridline_kwargs:
    color: darkgray
    linewidth: 0.5
    alpha: 0.3
  legend_kwargs:
    loc: upper center
    bbox_to_anchor: [0.5, -0.4]
    borderaxespad: 0.0
  pyplot_kwargs:
    title: "{title} ({{timerange}})"
  plot_kwargs:
    "{{alias_plot_kwargs}}":
      label: "{dataset} ({exp})"
      linewidth: 1.25
      zorder: 2.5
    default:  # These will be used for CMIP6 models
      color: lightgray
      label: null
      linewidth: 0.75
      zorder: 1.0
    CMIP6:
      label: "{project}"  # just to have one label for the gray lines
    CMIP6_MPI-ESM1-2-LR:
      label: "{project}"  # just to have one label for the gray lines
    OBS: &obs_format
      color: black
      label: "{dataset}"
      linewidth: 1.0
      zorder: 2.4
    OBS6: &obs6_format
      <<: *obs_format
      linestyle: dashdot
    native6: &native6_format
      <<: *obs_format
    native6_ORAS5: *native6_format
    ORAS5: *native6_format


datasets: "{{dataset_list}}"


preprocessors:

  create_atlantic_arctic_ocean_zonal_mean_hfbasin:
    custom_order: true
    extract_named_regions:
      regions: atlantic_arctic_ocean
    climate_statistics:
      operator: mean
      period: full
    convert_units:
      units: PW

  create_indian_pacific_ocean_zonal_mean_hfbasin:
    custom_order: true
    extract_named_regions:
      regions: indian_pacific_ocean
    climate_statistics:
      operator: mean
      period: full
    convert_units:
      units: PW

  create_global_ocean_zonal_mean_hfbasin:
    custom_order: true
    extract_named_regions:
      regions: global_ocean
    climate_statistics:
      operator: mean
      period: full
    convert_units:
      units: PW


diagnostics:

  ocean_heat_transport:
    description: Zonal mean line plots of ocean northward heat transport.
    themes:
      - phys
    realms:
      - ocean
    variables:
      hfbasin_atlantic_arctic_ocean:
        short_name: hfbasin
        mip: Omon
        preprocessor: create_atlantic_arctic_ocean_zonal_mean_hfbasin
        title: Northward Atlantic/Arctic Ocean Heat Transport
      hfbasin_indian_pacific_ocean:
        short_name: hfbasin
        mip: Omon
        preprocessor: create_indian_pacific_ocean_zonal_mean_hfbasin
        title: Northward Indian/Pacific Ocean Heat Transport
      hfbasin_global_ocean:
        short_name: hfbasin
        mip: Omon
        preprocessor: create_global_ocean_zonal_mean_hfbasin
        title: Northward Global Ocean Heat Transport
    additional_datasets: *datasets_cmip6
    scripts:
      plot:
        <<: *plot_script
        plots:
          variable_vs_lat:
            <<: *variable_vs_lat_plot
