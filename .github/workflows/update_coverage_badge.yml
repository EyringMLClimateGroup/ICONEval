---
name: Update Coverage Badge

permissions:
  contents: write

on:
  push:
    branches: [main]

defaults:
  run:
    shell: pixi run bash -e {0}

jobs:
  update_badge:
    runs-on: ubuntu-latest
    name: Update Coverage Badge
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true  # necessary for git-auto-commit-action
      - name: Setup environment
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          frozen: true
      - name: Run tests
        run: |
          pytest -n 2 --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-report=term-missing --cov=iconeval tests/
      - name: Comment coverage
        id: coverage
        uses: MishaKav/pytest-coverage-comment@fd9adbdca9fdfbe2b9bfa44a7340e6a83346ce6c # v1.10.0
        with:
          coverage-path-prefix: src/iconeval/
          hide-comment: true
          junitxml-path: ./pytest.xml
          pytest-xml-coverage-path: ./coverage.xml
      - name: Update README
        run: |
          sed -i "/<!-- Pytest Coverage Comment:Begin -->/,/<!-- Pytest Coverage Comment:End -->/c\<!-- Pytest Coverage Comment:Begin -->\n${STEPS_COVERAGE_OUTPUTS_COVERAGE_HTML}\n<!-- Pytest Coverage Comment:End -->" ./README.md
        env:
          STEPS_COVERAGE_OUTPUTS_COVERAGE_HTML: ${{ steps.coverage.outputs.coverageHtml }}
      - name: Detect changes
        run: |
          export GIT_DIFF=$(git diff --stat | head -n 1)
          echo "GIT_DIFF=${GIT_DIFF}" >> ${GITHUB_ENV}
          if [ "${GIT_DIFF}" == '' ]; then
            echo "No changes detected"
          else
            echo "Changes detected"
          fi
      - name: Set name of target branch
        run: |
          export TARGET_BRANCH=update_coverage_badge_$(date +%s)
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> ${GITHUB_ENV}
          echo "Target branch: ${TARGET_BRANCH}"
      - name: Commit changes
        if: ${{ env.GIT_DIFF != '' }}
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ env.TARGET_BRANCH }}
          commit_message: Update coverage badge
          create_branch: true
          file_pattern: README.md
