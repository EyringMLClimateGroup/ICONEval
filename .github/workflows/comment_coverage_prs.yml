---
name: Comment coverage in PRs

permissions:
  pull-requests: write

on:
  pull_request:
    branches:
      - "*"

defaults:
  run:
    shell: pixi run bash -e {0}

jobs:
  comment_coverage_in_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          frozen: true
      - name: Run tests
        run: |
          pytest -n 2 --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered --cov=iconeval tests/
      - name: Comment coverage
        uses: MishaKav/pytest-coverage-comment@ce64cfb4332195faa36733a0364dda8849109f70 # v1.11.2
        with:
          coverage-path-prefix: src/iconeval/
          junitxml-path: ./pytest.xml
          pytest-xml-coverage-path: ./coverage.xml
